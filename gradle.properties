org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

# android.useAndroidX y android.nonTransitiveRClass ya son true por defecto en AGP 9:
# no hace falta declararlos.
#
# Otros defaults de AGP 9 que conviene conocer y NO revertir:
#   android.defaults.buildfeatures.buildconfig = false   (actívalo por módulo si hace falta)
#   android.defaults.buildfeatures.resvalues   = false
#   android.r8.proguardAndroidTxt.disallowed   = true    (usar proguard-android-optimize.txt)
#   android.r8.optimizedResourceShrinking      = true
